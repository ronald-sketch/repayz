    <title>REPAYZ - Statiegeld & Geld Verdienen met Recycling</title>
    
    <!-- Inline critical CSS for faster FCP -->
    <style>
      /* Critical above-the-fold styles */
      *,*::before,*::after{box-sizing:border-box}
      body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;background:#fff}
      #root{min-height:100vh}
      .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
      /* LCP optimization - H1 critical styles */
      h1{font-size:3rem;font-weight:700;line-height:1.1;color:#1a3a52;margin:0}
      @media(min-width:768px){h1{font-size:3.75rem}}
      /* Header critical styles */
      header{position:sticky;top:0;z-index:50;background:#fff}
      nav{display:flex;align-items:center}
      img{max-width:100%;height:auto}
      /* Container */
      .container{width:100%;margin:0 auto;padding:0 1rem}
      @media(min-width:768px){.container{max-width:768px}}
      @media(min-width:1024px){.container{max-width:1024px}}
      @media(min-width:1280px){.container{max-width:1280px}}
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Defer analytics loading for better performance -->
    <script>
      // Load analytics after page is interactive
      if ('requestIdleCallback' in window) {
        requestIdleCallback(function() {
          var s = document.createElement('script');
          s.src = '%VITE_ANALYTICS_ENDPOINT%/umami';
          s.dataset.websiteId = '%VITE_ANALYTICS_WEBSITE_ID%';
          s.dataset.autoTrack = 'false';
          s.async = true;
          document.body.appendChild(s);
          s.onload = function() {
            setTimeout(function() {
              if (typeof umami !== 'undefined') umami.track();
            }, 1000);
          };
        }, { timeout: 3000 });
      } else {
        window.addEventListener('load', function() {
          setTimeout(function() {
            var s = document.createElement('script');
            s.src = '%VITE_ANALYTICS_ENDPOINT%/umami';
            s.dataset.websiteId = '%VITE_ANALYTICS_WEBSITE_ID%';
            s.dataset.autoTrack = 'false';
            s.async = true;
            document.body.appendChild(s);
            s.onload = function() {
              setTimeout(function() {
                if (typeof umami !== 'undefined') umami.track();
              }, 1000);
            };
          }, 2000);
        });
      }
    </script>
